name: Build Enhanced Source With Deferred Shaders

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: C++ build configuration
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release

  push:
    branches:
      - master
      - main
    paths:
      - "src/**"
      - "game/bin/shadercompile.exe"
      - "game/bin/shadercompile_dll.dll"
      - "game/bin/tier0.dll"
      - "game/bin/vstdlib.dll"
      - ".github/workflows/build-enhanced-source.yml"

permissions:
  contents: read

jobs:
  build:
    name: Deferred shaders + ${{ inputs.configuration || 'Debug' }} Win32
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      BUILD_CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
      ARTIFACT_DIR: artifacts

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Prepare build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path $env:ARTIFACT_DIR | Out-Null

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vsPath = & $vswhere `
              -latest `
              -products * `
              -requires Microsoft.VisualStudio.Component.VC.v142.x86.x64 `
              -property installationPath

          if (!$vsPath) {
              $vsPath = & $vswhere `
                  -latest `
                  -products * `
                  -requires Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64 `
                  -property installationPath
          }

          if (!$vsPath) {
              throw "MSVC v142 x86/x64 was not found on the windows-2022 runner."
          }

          $vsDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"

          if (!(Test-Path $vsDevCmd)) {
              throw "VsDevCmd.bat was not found: $vsDevCmd"
          }

          "VS_PATH=$vsPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VSDEVCMD=$vsDevCmd" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Visual Studio: $vsPath"
          Write-Host "Developer environment: $vsDevCmd"
          Write-Host "MSBuild:"
          Get-Command msbuild.exe | Format-List Source

          Write-Host "Installed MSVC toolsets:"
          Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory |
              Select-Object -ExpandProperty Name

      - name: Add legacy VPC registry compatibility
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions

          set "CPP_GUID={8BC9CEB8-8B4A-11D0-8D11-00A0C91BC942}"

          reg add "HKLM\SOFTWARE\Microsoft\VisualStudio\10.0\Projects\%CPP_GUID%" ^
            /v DefaultProjectExtension ^
            /t REG_SZ ^
            /d vcproj ^
            /f ^
            /reg:32
          if errorlevel 1 exit /b 1

          reg add "HKCU\Software\Microsoft\VisualStudio\10.0_Config\Projects\%CPP_GUID%" ^
            /v DefaultProjectExtension ^
            /t REG_SZ ^
            /d vcproj ^
            /f ^
            /reg:32
          if errorlevel 1 exit /b 1

          reg add "HKLM\SOFTWARE\Microsoft\VisualStudio\12.0\Projects\%CPP_GUID%" ^
            /v DefaultProjectExtension ^
            /t REG_SZ ^
            /d vcxproj ^
            /f ^
            /reg:32
          if errorlevel 1 exit /b 1

          reg add "HKCU\Software\Microsoft\VisualStudio\12.0_Config\Projects\%CPP_GUID%" ^
            /v DefaultProjectExtension ^
            /t REG_SZ ^
            /d vcxproj ^
            /f ^
            /reg:32
          if errorlevel 1 exit /b 1

          reg query "HKLM\SOFTWARE\Microsoft\VisualStudio\10.0\Projects\%CPP_GUID%" ^
            /v DefaultProjectExtension ^
            /reg:32

      - name: Install required Perl CRC32 module
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions

          perl -MString::CRC32 -e "print qq(String::CRC32 already installed\n)" >nul 2>&1
          if not errorlevel 1 goto CRC_READY

          echo Installing String::CRC32 from CPAN...
          set "PERL_MM_USE_DEFAULT=1"
          set "NONINTERACTIVE_TESTING=1"

          cpan -T -i String::CRC32
          if errorlevel 1 (
              echo ERROR: CPAN failed to install String::CRC32.
              exit /b 1
          )

          :CRC_READY
          perl -MString::CRC32 -e "print qq(String::CRC32 is available\n)"
          if errorlevel 1 (
              echo ERROR: Perl still cannot load String::CRC32.
              exit /b 1
          )

      - name: Verify shader compiler files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
              "game\bin\shadercompile.exe",
              "game\bin\shadercompile_dll.dll",
              "game\bin\tier0.dll",
              "game\bin\vstdlib.dll",
              "game\deferred\gameinfo.txt",
              "src\devtools\bin\updateshaders.pl",
              "src\devtools\bin\fxc_prep.pl",
              "src\devtools\bin\copyshaderincfiles.pl",
              "src\devtools\bin\d3dx9_33.dll",
              "src\dx10sdk\utilities\dx9_30\dx_proxy.dll",
              "src\materialsystem\deferredshaders\buildshaders.bat",
              "src\materialsystem\deferredshaders\deferred_shaders.txt"
          )

          foreach ($file in $required) {
              if (!(Test-Path $file)) {
                  throw "Required shader build file is missing: $file"
              }

              $item = Get-Item $file
              Write-Host "$file  [$($item.Length) bytes]"
          }

      - name: Force rebuild of every Deferred shader
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $shaderRoot = "src\materialsystem\deferredshaders"
          $shaderList = Join-Path $shaderRoot "deferred_shaders.txt"

          $shaderSources = Get-Content $shaderList |
              ForEach-Object { $_.Trim() } |
              Where-Object {
                  $_ -and
                  !$_.StartsWith("//") -and
                  !$_.StartsWith("#")
              }

          function Get-ForcedShaderOutputName {
              param([Parameter(Mandatory = $true)][string]$SourceName)

              if ($SourceName -notmatch '\.fxc$') {
                  throw "Unsupported shader-list entry: $SourceName"
              }

              $base = [System.IO.Path]::GetFileNameWithoutExtension($SourceName)

              # buildshaders.bat sets DIRECTX_FORCE_MODEL=30 when -force30
              # is supplied. Valve's loader applies these output transforms.
              $base = $base -replace '_ps2x$', '_ps30'
              $base = $base -replace '_ps20b$', '_ps30'
              $base = $base -replace '_ps20$', '_ps30'
              $base = $base -replace '_vs20$', '_vs30'
              $base = $base -replace '_vsxx$', '_vs30'

              return "$base.vcs"
          }

          $expected = $shaderSources |
              ForEach-Object { Get-ForcedShaderOutputName $_ } |
              Sort-Object -Unique

          # updateshaders.pl compares CRCs against game\platform\shaders.
          # Delete only this project's expected VCS files there, otherwise
          # unchanged committed bytecode can make the build skip compilation.
          $outputDirectories = @(
              "src\materialsystem\deferredshaders\shaders\fxc",
              "game\deferred\shaders\fxc",
              "game\platform\shaders\fxc"
          )

          foreach ($directory in $outputDirectories) {
              New-Item -ItemType Directory -Force -Path $directory |
                  Out-Null

              foreach ($name in $expected) {
                  Remove-Item `
                      (Join-Path $directory $name) `
                      -Force `
                      -ErrorAction SilentlyContinue
              }
          }

          Remove-Item `
              "src\materialsystem\deferredshaders\fxctmp9\*.inc" `
              -Force `
              -ErrorAction SilentlyContinue

          Remove-Item `
              "src\materialsystem\deferredshaders\fxctmp9_tmp\*.inc" `
              -Force `
              -ErrorAction SilentlyContinue

          $temporaryFiles = @(
              "src\materialsystem\deferredshaders\filelist.txt",
              "src\materialsystem\deferredshaders\filelistgen.txt",
              "src\materialsystem\deferredshaders\filestocopy.txt",
              "src\materialsystem\deferredshaders\uniquefilestocopy.txt",
              "src\materialsystem\deferredshaders\inclist.txt",
              "src\materialsystem\deferredshaders\vcslist.txt",
              "src\materialsystem\deferredshaders\makefile.deferred_shaders",
              "src\materialsystem\deferredshaders\makefile.deferred_shaders.copy"
          )

          Remove-Item $temporaryFiles -Force -ErrorAction SilentlyContinue

          Write-Host "Forced rebuild of $($expected.Count) Deferred VCS files."

      - name: Compile all Deferred HLSL shaders
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions

          call "%VSDEVCMD%" -no_logo -arch=x86 -host_arch=x64
          if errorlevel 1 (
              echo ERROR: Failed to initialize the Visual Studio developer environment.
              exit /b 1
          )

          where nmake.exe
          if errorlevel 1 (
              echo ERROR: nmake.exe is not available.
              exit /b 1
          )

          where perl.exe
          if errorlevel 1 (
              echo ERROR: perl.exe is not available.
              exit /b 1
          )

          perl -MString::CRC32 -e "print qq(String::CRC32 OK\n)"
          if errorlevel 1 (
              echo ERROR: String::CRC32 is unavailable.
              exit /b 1
          )

          set "SHADER_LOG=%GITHUB_WORKSPACE%\%ARTIFACT_DIR%\shader-build.log"
          set "dynamic_shaders=0"

          if not exist "%GITHUB_WORKSPACE%\game\deferred\GameInfo.txt" (
              echo ERROR: Missing %GITHUB_WORKSPACE%\game\deferred\GameInfo.txt
              exit /b 1
          )

          pushd "%GITHUB_WORKSPACE%\src\materialsystem\deferredshaders"

          rem GAMEDIR must be absolute because buildshaders.bat changes the
          rem current directory to game\bin before launching shadercompile.exe.
          rem SDKBINDIR and SOURCEDIR must remain relative because they are
          rem written into Valve's shader work/copy lists.
          set "GAMEDIR=%GITHUB_WORKSPACE%\game\deferred"
          set "SDKBINDIR=..\..\..\game\bin"
          set "SOURCEDIR=..\.."

          echo Shader source: %CD%
          echo Game directory: %GAMEDIR%
          echo SDK binary directory: %SDKBINDIR%
          echo Source root: %SOURCEDIR%

          call buildshaders.bat ^
            deferred_shaders ^
            -game "%GAMEDIR%" ^
            -source "%SOURCEDIR%" ^
            -dx9_30 ^
            -force30 ^
            > "%SHADER_LOG%" 2>&1

          set "SHADER_SCRIPT_RESULT=%ERRORLEVEL%"
          popd

          type "%SHADER_LOG%"
          echo buildshaders.bat exit code: %SHADER_SCRIPT_RESULT%

          rem Valve's old batch file does not reliably propagate failures.
          rem Validation below checks logs and every expected VCS output.
          exit /b 0

      - name: Validate compiled Deferred shaders
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $shaderRoot = "src\materialsystem\deferredshaders"
          $sourceOutput = Join-Path $shaderRoot "shaders\fxc"
          $gameOutput = "game\deferred\shaders\fxc"
          $shaderList = Join-Path $shaderRoot "deferred_shaders.txt"
          $logPath = Join-Path $env:ARTIFACT_DIR "shader-build.log"

          if (!(Test-Path $logPath)) {
              throw "Shader build log was not produced."
          }

          $logText = Get-Content $logPath -Raw

          $fatalPatterns = @(
              '(?im)\bfatal error\b',
              '(?im)\berror\s+X\d+\b',
              '(?im)\berror\s+C\d+\b',
              '(?im)\bERROR\(S\):\s*[1-9]\d*\b',
              '(?im)\bshader compile failed\b',
              '(?im)^Can''t locate .+$',
              '(?im)^Can''t find .+$',
              '(?im)Unable to find GameInfo\.txt',
              '(?im)not a valid game directory',
              '(?im)^NMAKE\s*:\s*fatal error\b',
              '(?im)^No such file or directory\b'
          )

          foreach ($pattern in $fatalPatterns) {
              if ($logText -match $pattern) {
                  throw "Shader compiler errors were found in shader-build.log. First match: $($Matches[0])"
              }
          }

          # The old shader compiler can print one harmless generic Windows
          # path warning and still finish correctly. Validate positive build
          # milestones and the actual VCS outputs instead.
          if ($logText -notmatch '(?im)Compiling\s+[\d,]+\s+commands') {
              throw "shadercompile.exe did not begin shader command compilation."
          }

          if ($logText -notmatch '(?im)\b\d+\s+File\(s\) copied\b') {
              throw "The shader build did not report copying compiled VCS files."
          }

          $shaderSources = Get-Content $shaderList |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and !$_.StartsWith("//") -and !$_.StartsWith("#") }

          function Get-ForcedShaderOutputName {
              param([Parameter(Mandatory = $true)][string]$SourceName)

              if ($SourceName -notmatch '\.fxc$') {
                  throw "Unsupported shader-list entry: $SourceName"
              }

              $base = [System.IO.Path]::GetFileNameWithoutExtension($SourceName)

              # buildshaders.bat sets DIRECTX_FORCE_MODEL=30 when -force30
              # is supplied. Valve's loader applies these output transforms.
              $base = $base -replace '_ps2x$', '_ps30'
              $base = $base -replace '_ps20b$', '_ps30'
              $base = $base -replace '_ps20$', '_ps30'
              $base = $base -replace '_vs20$', '_vs30'
              $base = $base -replace '_vsxx$', '_vs30'

              return "$base.vcs"
          }

          $expected = $shaderSources |
              ForEach-Object { Get-ForcedShaderOutputName $_ } |
              Sort-Object -Unique

          $missing = New-Object System.Collections.Generic.List[string]
          $empty = New-Object System.Collections.Generic.List[string]

          foreach ($name in $expected) {
              foreach ($directory in @($sourceOutput, $gameOutput)) {
                  $path = Join-Path $directory $name

                  if (!(Test-Path $path)) {
                      $missing.Add($path)
                      continue
                  }

                  if ((Get-Item $path).Length -le 0) {
                      $empty.Add($path)
                  }
              }
          }

          if ($missing.Count -gt 0) {
              throw "Missing compiled shader files:`n$($missing -join "`n")"
          }

          if ($empty.Count -gt 0) {
              throw "Zero-byte compiled shader files:`n$($empty -join "`n")"
          }

          Write-Host "Compiled shader files:"
          Get-ChildItem $gameOutput -Filter *.vcs |
              Sort-Object Name |
              Select-Object Name, Length, LastWriteTime |
              Format-Table -AutoSize

          Write-Host "Validated $($expected.Count) forced-SM3 VCS files in both output directories."

      - name: Generate Deferred solution with VPC
        shell: cmd
        working-directory: src
        run: |
          @echo off
          setlocal EnableExtensions

          echo === VPC output === > "..\%ARTIFACT_DIR%\vpc.log"

          devtools\bin\vpc.exe ^
            /deferred ^
            +game ^
            /mksln Game_Deferred-2019.sln ^
            /2013 ^
            /define:VS2019 ^
            >> "..\%ARTIFACT_DIR%\vpc.log" 2>&1

          set "VPC_RESULT=%ERRORLEVEL%"

          echo. >> "..\%ARTIFACT_DIR%\vpc.log"
          echo VPC exit code: %VPC_RESULT% >> "..\%ARTIFACT_DIR%\vpc.log"
          type "..\%ARTIFACT_DIR%\vpc.log"

          if not "%VPC_RESULT%"=="0" (
              exit /b %VPC_RESULT%
          )

          for %%F in (
            "Game_Deferred-2019.sln"
            "game\client\client_deferred.vcxproj"
            "game\server\server_deferred.vcxproj"
            "materialsystem\shaderlib\shaderlib.vcxproj"
            "materialsystem\deferredshaders\game_shader_deferred.vcxproj"
          ) do (
            if not exist %%F (
              echo ERROR: Required generated file is missing: %%F
              exit /b 1
            )
          )

      - name: Build Deferred C++ solution
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions

          msbuild.exe "src\Game_Deferred-2019.sln" ^
            /m ^
            /t:Build ^
            /p:Configuration=%BUILD_CONFIGURATION% ^
            /p:Platform=Win32 ^
            /p:PlatformToolset=v142 ^
            /p:PreferredToolArchitecture=x64 ^
            /verbosity:minimal ^
            /bl:"%ARTIFACT_DIR%\EnhancedSource-%BUILD_CONFIGURATION%.binlog" ^
            /fl ^
            /flp:"logfile=%ARTIFACT_DIR%\EnhancedSource-%BUILD_CONFIGURATION%.log;verbosity=diagnostic" ^
            > "%ARTIFACT_DIR%\msbuild-console.log" 2>&1

          set "BUILD_RESULT=%ERRORLEVEL%"
          type "%ARTIFACT_DIR%\msbuild-console.log"
          exit /b %BUILD_RESULT%

      - name: Create ready-to-copy game patch
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $packageRoot = Join-Path `
              $env:ARTIFACT_DIR `
              "Enhanced-Source-$env:BUILD_CONFIGURATION-Game-Patch"

          $binTarget = Join-Path $packageRoot "bin"
          $shaderTarget = Join-Path $packageRoot "shaders"

          New-Item -ItemType Directory -Force -Path $binTarget | Out-Null
          New-Item -ItemType Directory -Force -Path $shaderTarget | Out-Null

          $requiredDlls = @(
              "game\deferred\bin\client.dll",
              "game\deferred\bin\server.dll",
              "game\deferred\bin\game_shader_generic_deferred.dll"
          )

          $missingDlls = $requiredDlls |
              Where-Object { !(Test-Path $_) }

          if ($missingDlls) {
              throw "Missing compiled DLLs: $($missingDlls -join ', ')"
          }

          Get-ChildItem "game\deferred\bin" -File |
              Where-Object { $_.Extension -in ".dll", ".pdb", ".map" } |
              Copy-Item -Destination $binTarget -Force

          Copy-Item `
              "game\deferred\shaders\*" `
              $shaderTarget `
              -Recurse `
              -Force

          Write-Host "Ready-to-copy package:"
          Get-ChildItem $packageRoot -Recurse -File |
              Select-Object FullName, Length |
              Format-Table -AutoSize

      - name: Upload game patch
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Enhanced-Source-${{ env.BUILD_CONFIGURATION }}-With-Deferred-Shaders
          path: artifacts/Enhanced-Source-${{ env.BUILD_CONFIGURATION }}-Game-Patch/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Enhanced-Source-${{ env.BUILD_CONFIGURATION }}-Build-Logs
          path: |
            artifacts/*.log
            artifacts/*.binlog
            src/Game_Deferred-2019.sln
            src/materialsystem/deferredshaders/fxctmp9/*.inc
            src/materialsystem/deferredshaders/fxctmp9_tmp/*.inc
          if-no-files-found: warn
          retention-days: 30
