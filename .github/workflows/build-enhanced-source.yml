# WORKFLOW_VERSION: RH-CACHE-V9
name: Build Enhanced Source With Deferred Shaders

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: C++ build configuration
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release

      compile_shaders:
        description: Compile Deferred HLSL shaders in this manual run
        required: true
        default: false
        type: boolean

  push:
    branches:
      - master
      - main
    paths:
      - "src/**"
      - "game/bin/shadercompile.exe"
      - "game/bin/shadercompile_dll.dll"
      - "game/bin/tier0.dll"
      - "game/bin/vstdlib.dll"
      - ".github/workflows/build-enhanced-source.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.configuration || 'Debug' }} Win32
    runs-on: windows-2022
    timeout-minutes: 120

    env:
      BUILD_CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
      ARTIFACT_DIR: artifacts
      WORKFLOW_VERSION: RH-CACHE-V9

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Confirm workflow revision
        shell: powershell
        run: |
          Write-Host "=================================================="
          Write-Host "Enhanced Source workflow: $env:WORKFLOW_VERSION"
          Write-Host "Persistent VCS cache: enabled"
          Write-Host "Pre-C++ compiled-shader artifact: enabled"
          Write-Host "Post-VPC shader header generation: enabled"
          Write-Host "=================================================="

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "## Workflow revision: $env:WORKFLOW_VERSION"

      - name: Compute Deferred shader cache identity
        id: shader_key
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path $env:ARTIFACT_DIR |
              Out-Null

          $workspace = (Get-Location).Path.TrimEnd('\')

          $shaderFiles = New-Object System.Collections.Generic.List[System.IO.FileInfo]

          foreach ($root in @(
              "src\materialsystem\deferredshaders",
              "src\materialsystem\stdshaders"
          )) {
              if (!(Test-Path $root)) {
                  continue
              }

              Get-ChildItem $root -Recurse -File |
                  Where-Object {
                      $_.FullName -notmatch '\\(fxctmp9|fxctmp9_tmp|shaders\\fxc|Debug_dx9_[^\\]+|Release_dx9_[^\\]+)\\' -and
                      $_.Extension.ToLowerInvariant() -in @(
                          ".fxc",
                          ".fxh",
                          ".h",
                          ".txt",
                          ".bat",
                          ".pl"
                      )
                  } |
                  ForEach-Object { $shaderFiles.Add($_) }
          }

          foreach ($path in @(
              "src\devtools\bin\updateshaders.pl",
              "src\devtools\bin\fxc_prep.pl",
              "src\devtools\bin\copyshaderincfiles.pl",
              "src\devtools\bin\valve_perl_helpers.pl",
              "game\bin\shadercompile.exe",
              "game\bin\shadercompile_dll.dll",
              "game\bin\tier0.dll",
              "game\bin\vstdlib.dll"
          )) {
              if (Test-Path $path) {
                  $shaderFiles.Add((Get-Item $path))
              }
          }

          if (Test-Path "src\dx10sdk\utilities\dx9_30") {
              Get-ChildItem "src\dx10sdk\utilities\dx9_30" -Recurse -File |
                  ForEach-Object { $shaderFiles.Add($_) }
          }

          $shaderFiles = @(
              $shaderFiles |
                  Sort-Object FullName -Unique
          )

          if ($shaderFiles.Count -eq 0) {
              throw "No shader inputs were found while generating the cache key."
          }

          $identityLines = foreach ($file in $shaderFiles) {
              $relative = $file.FullName.Substring($workspace.Length).
                  TrimStart('\').
                  Replace('\', '/')

              $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash

              "$relative`t$hash"
          }

          $identityText = $identityLines -join "`n"
          $identityBytes = [Text.Encoding]::UTF8.GetBytes($identityText)

          $sha256 = [Security.Cryptography.SHA256]::Create()

          try {
              $identityHash = (
                  $sha256.ComputeHash($identityBytes) |
                      ForEach-Object { $_.ToString("x2") }
              ) -join ""
          }
          finally {
              $sha256.Dispose()
          }

          $prefix = "enhanced-source-deferred-vcs-v9-windows-$identityHash-"
          $saveKey = "$prefix$env:GITHUB_RUN_ID"

          "prefix=$prefix" |
              Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "save_key=$saveKey" |
              Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $identityLines |
              Set-Content `
                  "$env:ARTIFACT_DIR\shader-cache-inputs.txt" `
                  -Encoding utf8

          Write-Host "Shader source files: $($shaderFiles.Count)"
          Write-Host "Shader cache prefix: $prefix"
          Write-Host "Shader cache save key: $saveKey"

      - name: Decide whether shaders need compilation
        id: shader_changes
        shell: powershell
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          MANUAL_COMPILE_SHADERS: ${{ inputs.compile_shaders }}
        run: |
          $ErrorActionPreference = "Stop"

          $compileShaders = $false
          $reason = ""

          if ($env:EVENT_NAME -eq "workflow_dispatch") {
              $compileShaders =
                  $env:MANUAL_COMPILE_SHADERS.ToLowerInvariant() -eq "true"

              if ($compileShaders) {
                  $reason = "Enabled manually"
              }
              else {
                  $reason = "Disabled for this manual run"
              }
          }
          elseif ($env:EVENT_NAME -eq "push") {
              $before = $env:EVENT_BEFORE
              $after = $env:EVENT_SHA

              if (!$before -or $before -match '^0+$') {
                  $changedFiles = @(
                      git show `
                          --format="" `
                          --name-only `
                          $after
                  )
              }
              else {
                  $changedFiles = @(
                      git diff `
                          --name-only `
                          $before `
                          $after
                  )
              }

              $changedFiles = $changedFiles |
                  ForEach-Object { $_.Trim().Replace('\', '/') } |
                  Where-Object { $_ }

              Write-Host "Files changed in this push:"
              $changedFiles | ForEach-Object { Write-Host "  $_" }

              $shaderPatterns = @(
                  '^src/materialsystem/deferredshaders/.*\.(fxc|fxh|h|inc|txt|bat|pl)$',
                  '^src/materialsystem/stdshaders/.*\.(fxc|fxh|h|inc)$',
                  '^src/devtools/bin/(updateshaders|fxc_prep|copyshaderincfiles|valve_perl_helpers)\.pl$',
                  '^src/dx10sdk/utilities/dx9_30/',
                  '^game/bin/(shadercompile\.exe|shadercompile_dll\.dll|tier0\.dll|vstdlib\.dll)$'
              )

              $matchingFiles = foreach ($file in $changedFiles) {
                  foreach ($pattern in $shaderPatterns) {
                      if ($file -match $pattern) {
                          $file
                          break
                      }
                  }
              }

              $matchingFiles = $matchingFiles | Sort-Object -Unique
              $compileShaders = @($matchingFiles).Count -gt 0

              if ($compileShaders) {
                  $reason =
                      "Shader-related files changed: " +
                      ($matchingFiles -join ", ")
              }
              else {
                  $reason = "No shader-related files changed"
              }
          }
          else {
              $reason = "Unsupported trigger; shaders disabled"
          }

          $compileValue = $compileShaders.ToString().ToLowerInvariant()
          $artifactMode = if ($compileShaders) {
              "With-Rebuilt-Shaders"
          }
          else {
              "With-Cached-Shaders"
          }

          "compile=$compileValue" |
              Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "artifact_mode=$artifactMode" |
              Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "reason=$reason" |
              Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Compile shaders: $compileValue"
          Write-Host "Reason: $reason"

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "## Shader compilation decision"

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "- Compile shaders: **$compileValue**"

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "- Reason: $reason"

          if (!$compileShaders) {
              Add-Content `
                  $env:GITHUB_STEP_SUMMARY `
                  "- Important: enable shader compilation whenever FXC combo declarations or generated fxctmp9 headers changed."
          }

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Prepare build environment
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path $env:ARTIFACT_DIR | Out-Null

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vsPath = & $vswhere `
              -latest `
              -products * `
              -requires Microsoft.VisualStudio.Component.VC.v142.x86.x64 `
              -property installationPath

          if (!$vsPath) {
              $vsPath = & $vswhere `
                  -latest `
                  -products * `
                  -requires Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64 `
                  -property installationPath
          }

          if (!$vsPath) {
              throw "MSVC v142 x86/x64 was not found on the windows-2022 runner."
          }

          $vsDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"

          if (!(Test-Path $vsDevCmd)) {
              throw "VsDevCmd.bat was not found: $vsDevCmd"
          }

          "VS_PATH=$vsPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VSDEVCMD=$vsDevCmd" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Visual Studio: $vsPath"
          Write-Host "Developer environment: $vsDevCmd"
          Write-Host "MSBuild:"
          Get-Command msbuild.exe | Format-List Source

          Write-Host "Installed MSVC toolsets:"
          Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory |
              Select-Object -ExpandProperty Name

          $sdkVersion = "10.0.19041.0"
          $sdkInclude = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$sdkVersion"

          if (!(Test-Path $sdkInclude)) {
              throw "Required Windows SDK $sdkVersion is not installed on this runner."
          }

          Write-Host "Using Windows SDK: $sdkVersion"

      - name: Add legacy VPC registry compatibility
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions

          set "CPP_GUID={8BC9CEB8-8B4A-11D0-8D11-00A0C91BC942}"

          reg add "HKLM\SOFTWARE\Microsoft\VisualStudio\10.0\Projects\%CPP_GUID%" ^
            /v DefaultProjectExtension ^
            /t REG_SZ ^
            /d vcproj ^
            /f ^
            /reg:32
          if errorlevel 1 exit /b 1

          reg add "HKCU\Software\Microsoft\VisualStudio\10.0_Config\Projects\%CPP_GUID%" ^
            /v DefaultProjectExtension ^
            /t REG_SZ ^
            /d vcproj ^
            /f ^
            /reg:32
          if errorlevel 1 exit /b 1

          reg add "HKLM\SOFTWARE\Microsoft\VisualStudio\12.0\Projects\%CPP_GUID%" ^
            /v DefaultProjectExtension ^
            /t REG_SZ ^
            /d vcxproj ^
            /f ^
            /reg:32
          if errorlevel 1 exit /b 1

          reg add "HKCU\Software\Microsoft\VisualStudio\12.0_Config\Projects\%CPP_GUID%" ^
            /v DefaultProjectExtension ^
            /t REG_SZ ^
            /d vcxproj ^
            /f ^
            /reg:32
          if errorlevel 1 exit /b 1

          reg query "HKLM\SOFTWARE\Microsoft\VisualStudio\10.0\Projects\%CPP_GUID%" ^
            /v DefaultProjectExtension ^
            /reg:32

      - name: Install required Perl CRC32 module
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions

          perl -MString::CRC32 -e "print qq(String::CRC32 already installed\n)" >nul 2>&1
          if not errorlevel 1 goto CRC_READY

          echo Installing String::CRC32 from CPAN...
          set "PERL_MM_USE_DEFAULT=1"
          set "NONINTERACTIVE_TESTING=1"

          cpan -T -i String::CRC32
          if errorlevel 1 (
              echo ERROR: CPAN failed to install String::CRC32.
              exit /b 1
          )

          :CRC_READY
          perl -MString::CRC32 -e "print qq(String::CRC32 is available\n)"
          if errorlevel 1 (
              echo ERROR: Perl still cannot load String::CRC32.
              exit /b 1
          )

      - name: Verify shader compiler files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
              "game\bin\shadercompile.exe",
              "game\bin\shadercompile_dll.dll",
              "game\bin\tier0.dll",
              "game\bin\vstdlib.dll",
              "game\deferred\gameinfo.txt",
              "src\devtools\bin\updateshaders.pl",
              "src\devtools\bin\fxc_prep.pl",
              "src\devtools\bin\copyshaderincfiles.pl",
              "src\devtools\bin\d3dx9_33.dll",
              "src\dx10sdk\utilities\dx9_30\dx_proxy.dll",
              "src\materialsystem\deferredshaders\buildshaders.bat",
              "src\materialsystem\deferredshaders\deferred_shaders.txt"
          )

          foreach ($file in $required) {
              if (!(Test-Path $file)) {
                  throw "Required shader build file is missing: $file"
              }

              $item = Get-Item $file
              Write-Host "$file  [$($item.Length) bytes]"
          }

      - name: Restore previously compiled Deferred VCS files
        id: restore_shader_vcs
        if: steps.shader_changes.outputs.compile != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            src/materialsystem/deferredshaders/shaders/fxc
            game/deferred/shaders/fxc
          key: ${{ steps.shader_key.outputs.prefix }}restore-${{ github.run_id }}
          restore-keys: |
            ${{ steps.shader_key.outputs.prefix }}
          fail-on-cache-miss: true

      - name: Validate restored Deferred VCS files
        if: steps.shader_changes.outputs.compile != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $shaderRoot = "src\materialsystem\deferredshaders"
          $shaderList = Join-Path $shaderRoot "deferred_shaders.txt"
          $sourceOutput = Join-Path $shaderRoot "shaders\fxc"
          $gameOutput = "game\deferred\shaders\fxc"

          function Get-ForcedOutputName {
              param([Parameter(Mandatory = $true)][string]$SourceName)

              $base = [IO.Path]::GetFileNameWithoutExtension($SourceName)
              $base = $base -replace '_ps2x$', '_ps30'
              $base = $base -replace '_ps20b$', '_ps30'
              $base = $base -replace '_ps20$', '_ps30'
              $base = $base -replace '_vs20$', '_vs30'
              $base = $base -replace '_vsxx$', '_vs30'

              return "$base.vcs"
          }

          function Get-LegacyOutputNames {
              param([Parameter(Mandatory = $true)][string]$SourceName)

              $base = [IO.Path]::GetFileNameWithoutExtension($SourceName)

              if ($base -match '_ps2x$') {
                  Write-Output "$($base -replace '_ps2x$', '_ps20').vcs"
                  Write-Output "$($base -replace '_ps2x$', '_ps20b').vcs"
                  return
              }

              if ($base -match '_vsxx$') {
                  Write-Output "$($base -replace '_vsxx$', '_vs20').vcs"
                  return
              }

              if ($base -match '_(ps20|ps20b|vs20)$') {
                  Write-Output "$base.vcs"
              }
          }

          $shaderSources = Get-Content $shaderList |
              ForEach-Object { $_.Trim() } |
              Where-Object {
                  $_ -and
                  !$_.StartsWith("//") -and
                  !$_.StartsWith("#")
              }

          $expected = New-Object System.Collections.Generic.List[string]

          foreach ($sourceName in $shaderSources) {
              $expected.Add((Get-ForcedOutputName $sourceName))

              foreach ($legacyName in @(Get-LegacyOutputNames $sourceName)) {
                  $expected.Add($legacyName)
              }
          }

          $expected = @($expected | Sort-Object -Unique)
          $problems = New-Object System.Collections.Generic.List[string]

          foreach ($name in $expected) {
              foreach ($directory in @($sourceOutput, $gameOutput)) {
                  $path = Join-Path $directory $name

                  if (!(Test-Path $path)) {
                      $problems.Add("Missing: $path")
                      continue
                  }

                  if ((Get-Item $path).Length -le 0) {
                      $problems.Add("Empty: $path")
                  }
              }
          }

          if ($problems.Count -gt 0) {
              throw @"
          The cached shader set is incomplete:

          $($problems -join "`n")

          Run the workflow once with:
          Compile Deferred HLSL shaders = true
          "@
          }

          Write-Host "Restored and validated $($expected.Count) compiled VCS shaders."

      - name: Force clean Deferred shader rebuild
        if: steps.shader_changes.outputs.compile == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $shaderRoot = "src\materialsystem\deferredshaders"
          $shaderList = Join-Path $shaderRoot "deferred_shaders.txt"

          $shaderSources = Get-Content $shaderList |
              ForEach-Object { $_.Trim() } |
              Where-Object {
                  $_ -and
                  !$_.StartsWith("//") -and
                  !$_.StartsWith("#")
              }

          # Build a tiny native-SM2 list only for entries whose output name
          # changes under -force30. The full list is compiled as SM3 later.
          $legacySources = $shaderSources |
              Where-Object {
                  $_ -match '_(ps2x|ps20|ps20b|vs20|vsxx)\.fxc$'
              }

          $legacyList = Join-Path $shaderRoot "deferred_shaders_legacy_ci.txt"
          $legacySources |
              Set-Content $legacyList -Encoding ascii

          Write-Host "Legacy shader sources:"
          $legacySources | ForEach-Object { Write-Host "  $_" }

          # Remove every old generated VCS from the two build output folders.
          # This prevents stale files from making the copy count look valid.
          $localOutputs = @(
              "src\materialsystem\deferredshaders\shaders\fxc",
              "game\deferred\shaders\fxc"
          )

          foreach ($directory in $localOutputs) {
              New-Item -ItemType Directory -Force -Path $directory |
                  Out-Null

              Get-ChildItem $directory -Filter *.vcs -File `
                  -ErrorAction SilentlyContinue |
                  Remove-Item -Force
          }

          # updateshaders.pl performs its CRC comparison against this directory.
          # Empty it on the ephemeral CI runner so every requested shader is
          # added to the worklist and genuinely rebuilt.
          $platformCache = "game\platform\shaders\fxc"

          if (Test-Path $platformCache) {
              Get-ChildItem $platformCache -Filter *.vcs -File `
                  -ErrorAction SilentlyContinue |
                  Remove-Item -Force
          }
          else {
              New-Item -ItemType Directory -Force -Path $platformCache |
                  Out-Null
          }

          $generatedDirectories = @(
              "src\materialsystem\deferredshaders\fxctmp9",
              "src\materialsystem\deferredshaders\fxctmp9_tmp"
          )

          foreach ($directory in $generatedDirectories) {
              if (Test-Path $directory) {
                  Get-ChildItem $directory -Filter *.inc -File `
                      -ErrorAction SilentlyContinue |
                      Remove-Item -Force
              }
          }

          $temporaryFiles = @(
              "src\materialsystem\deferredshaders\filelist.txt",
              "src\materialsystem\deferredshaders\filelistgen.txt",
              "src\materialsystem\deferredshaders\filestocopy.txt",
              "src\materialsystem\deferredshaders\uniquefilestocopy.txt",
              "src\materialsystem\deferredshaders\inclist.txt",
              "src\materialsystem\deferredshaders\vcslist.txt",
              "src\materialsystem\deferredshaders\makefile.deferred_shaders",
              "src\materialsystem\deferredshaders\makefile.deferred_shaders.copy",
              "src\materialsystem\deferredshaders\makefile.deferred_shaders_legacy_ci",
              "src\materialsystem\deferredshaders\makefile.deferred_shaders_legacy_ci.copy"
          )

          Remove-Item $temporaryFiles -Force -ErrorAction SilentlyContinue

          Write-Host "Cleared Deferred VCS outputs and Valve platform CRC cache."
          Write-Host "Full shader count: $($shaderSources.Count)"
          Write-Host "Legacy shader count: $($legacySources.Count)"

      - name: Compile all Deferred HLSL shaders
        if: steps.shader_changes.outputs.compile == 'true'
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions

          call "%VSDEVCMD%" -no_logo -arch=x86 -host_arch=x64
          if errorlevel 1 (
              echo ERROR: Failed to initialize the Visual Studio developer environment.
              exit /b 1
          )

          where nmake.exe >nul
          if errorlevel 1 (
              echo ERROR: nmake.exe is unavailable.
              exit /b 1
          )

          where perl.exe >nul
          if errorlevel 1 (
              echo ERROR: perl.exe is unavailable.
              exit /b 1
          )

          perl -MString::CRC32 -e "print qq(String::CRC32 OK\n)"
          if errorlevel 1 (
              echo ERROR: String::CRC32 is unavailable.
              exit /b 1
          )

          if not exist "%GITHUB_WORKSPACE%\game\deferred\GameInfo.txt" (
              echo ERROR: Missing game\deferred\GameInfo.txt
              exit /b 1
          )

          pushd "%GITHUB_WORKSPACE%\src\materialsystem\deferredshaders"

          set "dynamic_shaders=0"
          set "GAMEDIR=%GITHUB_WORKSPACE%\game\deferred"
          set "SDKBINDIR=..\..\..\game\bin"
          set "SOURCEDIR=..\.."

          rem Compile the native VS20/PS20/PS20b variants required by
          rem deferred_decalModulate.cpp and older runtime paths.
          call buildshaders.bat ^
            deferred_shaders_legacy_ci ^
            -game "%GAMEDIR%" ^
            -source "%SOURCEDIR%" ^
            -dx9_30 ^
            > "%GITHUB_WORKSPACE%\%ARTIFACT_DIR%\shader-build-legacy.log" 2>&1

          rem Compile every listed shader as Shader Model 3.
          call buildshaders.bat ^
            deferred_shaders ^
            -game "%GAMEDIR%" ^
            -source "%SOURCEDIR%" ^
            -dx9_30 ^
            -force30 ^
            > "%GITHUB_WORKSPACE%\%ARTIFACT_DIR%\shader-build-sm3.log" 2>&1

          popd

          echo === Native legacy shader build ===
          type "%GITHUB_WORKSPACE%\%ARTIFACT_DIR%\shader-build-legacy.log"

          echo === Complete forced-SM3 shader build ===
          type "%GITHUB_WORKSPACE%\%ARTIFACT_DIR%\shader-build-sm3.log"

          rem Valve's batch file does not reliably return shadercompile errors.
          rem The PowerShell validation step checks logs and every output.
          exit /b 0

      - name: Prepare recovery list for omitted shaders
        id: shader_recovery
        if: steps.shader_changes.outputs.compile == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $shaderRoot = "src\materialsystem\deferredshaders"
          $shaderList = Join-Path $shaderRoot "deferred_shaders.txt"
          $sourceOutput = Join-Path $shaderRoot "shaders\fxc"
          $gameOutput = "game\deferred\shaders\fxc"
          $platformOutput = "game\platform\shaders\fxc"
          $recoveryList = Join-Path $shaderRoot "deferred_shaders_recovery_ci.txt"
          $recoveryMap = Join-Path $env:ARTIFACT_DIR "shader-recovery-map.txt"

          function Get-ForcedOutputName {
              param([Parameter(Mandatory = $true)][string]$SourceName)

              $base = [IO.Path]::GetFileNameWithoutExtension($SourceName)
              $base = $base -replace '_ps2x$', '_ps30'
              $base = $base -replace '_ps20b$', '_ps30'
              $base = $base -replace '_ps20$', '_ps30'
              $base = $base -replace '_vs20$', '_vs30'
              $base = $base -replace '_vsxx$', '_vs30'
              return "$base.vcs"
          }

          $shaderSources = Get-Content $shaderList |
              ForEach-Object { $_.Trim() } |
              Where-Object {
                  $_ -and
                  !$_.StartsWith("//") -and
                  !$_.StartsWith("#")
              }

          $missingSources = New-Object System.Collections.Generic.List[string]
          $mapLines = New-Object System.Collections.Generic.List[string]

          foreach ($sourceName in $shaderSources) {
              $outputName = Get-ForcedOutputName $sourceName
              $sourcePath = Join-Path $sourceOutput $outputName
              $gamePath = Join-Path $gameOutput $outputName

              if (!(Test-Path $sourcePath) -or !(Test-Path $gamePath)) {
                  $missingSources.Add($sourceName)
                  $mapLines.Add("$sourceName -> $outputName")

                  # Eliminate every possible CRC or stale-output reason before
                  # retrying this shader as an isolated one-entry project.
                  foreach ($path in @(
                      (Join-Path $sourceOutput $outputName),
                      (Join-Path $gameOutput $outputName),
                      (Join-Path $platformOutput $outputName)
                  )) {
                      Remove-Item $path -Force -ErrorAction SilentlyContinue
                  }
              }
          }

          $missingSources = @($missingSources | Sort-Object -Unique)
          $mapLines | Set-Content $recoveryMap -Encoding utf8

          if ($missingSources.Count -gt 0) {
              $missingSources |
                  Set-Content $recoveryList -Encoding ascii

              "needed=true" |
                  Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

              Write-Host "Bulk shadercompile omitted $($missingSources.Count) shader source(s)."
              Write-Host "They will be rebuilt one at a time:"
              $mapLines | ForEach-Object { Write-Host "  $_" }
          }
          else {
              Set-Content $recoveryList -Value @() -Encoding ascii

              "needed=false" |
                  Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

              Write-Host "The bulk shader pass produced every forced-SM3 output."
          }

      - name: Recompile omitted shaders individually
        if: steps.shader_recovery.outputs.needed == 'true'
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion

          call "%VSDEVCMD%" -no_logo -arch=x86 -host_arch=x64
          if errorlevel 1 (
              echo ERROR: Failed to initialize the Visual Studio developer environment.
              exit /b 1
          )

          where nmake.exe >nul
          if errorlevel 1 (
              echo ERROR: nmake.exe is unavailable.
              exit /b 1
          )

          where perl.exe >nul
          if errorlevel 1 (
              echo ERROR: perl.exe is unavailable.
              exit /b 1
          )

          pushd "%GITHUB_WORKSPACE%\src\materialsystem\deferredshaders"

          set "dynamic_shaders=0"
          set "GAMEDIR=%GITHUB_WORKSPACE%\game\deferred"
          set "SDKBINDIR=..\..\..\game\bin"
          set "SOURCEDIR=..\.."
          set "RECOVERY_LOG=%GITHUB_WORKSPACE%\%ARTIFACT_DIR%\shader-build-recovery.log"

          > "%RECOVERY_LOG%" echo Deferred shader recovery build

          for /f "usebackq delims=" %%S in ("deferred_shaders_recovery_ci.txt") do (
              echo.>> "%RECOVERY_LOG%"
              echo ==================================================>> "%RECOVERY_LOG%"
              echo Isolated shader source: %%S>> "%RECOVERY_LOG%"
              echo ==================================================>> "%RECOVERY_LOG%"

              > "deferred_shader_single_ci.txt" echo %%S

              del /f /q "filelist.txt" 2>nul
              del /f /q "filelistgen.txt" 2>nul
              del /f /q "filestocopy.txt" 2>nul
              del /f /q "uniquefilestocopy.txt" 2>nul
              del /f /q "inclist.txt" 2>nul
              del /f /q "vcslist.txt" 2>nul
              del /f /q "makefile.deferred_shader_single_ci" 2>nul
              del /f /q "makefile.deferred_shader_single_ci.copy" 2>nul

              call buildshaders.bat ^
                deferred_shader_single_ci ^
                -game "%GAMEDIR%" ^
                -source "%SOURCEDIR%" ^
                -dx9_30 ^
                -force30 ^
                >> "%RECOVERY_LOG%" 2>&1
          )

          popd

          type "%RECOVERY_LOG%"

          rem The next validation step checks the actual files and scans this
          rem log for the precise FXC/shadercompile failure.
          exit /b 0

      - name: Validate compiled Deferred shaders
        if: steps.shader_changes.outputs.compile == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $shaderRoot = "src\materialsystem\deferredshaders"
          $sourceOutput = Join-Path $shaderRoot "shaders\fxc"
          $gameOutput = "game\deferred\shaders\fxc"
          $shaderList = Join-Path $shaderRoot "deferred_shaders.txt"

          $logPaths = New-Object System.Collections.Generic.List[string]
          $logPaths.Add("$env:ARTIFACT_DIR\shader-build-legacy.log")
          $logPaths.Add("$env:ARTIFACT_DIR\shader-build-sm3.log")

          $recoveryLog = "$env:ARTIFACT_DIR\shader-build-recovery.log"
          if (Test-Path $recoveryLog) {
              $logPaths.Add($recoveryLog)
          }

          $fatalPatterns = @(
              '(?im)\bfatal error\b',
              '(?im)\berror\s+X\d+\b',
              '(?im)\berror\s+C\d+\b',
              '(?im)\bERROR\(S\):\s*[1-9]\d*\b',
              '(?im)\bshader compile failed\b',
              '(?im)^FAILED:\s+.+$',
              '(?im)^Can''t locate .+$',
              '(?im)^Can''t find .+$',
              '(?im)Unable to find GameInfo\.txt',
              '(?im)not a valid game directory',
              '(?im)^NMAKE\s*:\s*fatal error\b',
              '(?im)^No such file or directory\b'
          )

          foreach ($logPath in $logPaths) {
              if (!(Test-Path $logPath)) {
                  throw "Shader build log was not produced: $logPath"
              }

              $logText = Get-Content $logPath -Raw

              foreach ($pattern in $fatalPatterns) {
                  if ($logText -match $pattern) {
                      throw "Shader compiler error in $logPath. First match: $($Matches[0])"
                  }
              }

              if ($logText -notmatch '(?im)Compiling\s+[\d,]+\s+commands') {
                  throw "shadercompile.exe did not start command compilation: $logPath"
              }

              if ($logText -notmatch '(?im)\b\d+\s+File\(s\) copied\b') {
                  throw "Shader build did not copy VCS outputs: $logPath"
              }
          }

          $shaderSources = Get-Content $shaderList |
              ForEach-Object { $_.Trim() } |
              Where-Object {
                  $_ -and
                  !$_.StartsWith("//") -and
                  !$_.StartsWith("#")
              }

          function Get-ForcedOutputName {
              param([Parameter(Mandatory = $true)][string]$SourceName)

              $base = [IO.Path]::GetFileNameWithoutExtension($SourceName)
              $base = $base -replace '_ps2x$', '_ps30'
              $base = $base -replace '_ps20b$', '_ps30'
              $base = $base -replace '_ps20$', '_ps30'
              $base = $base -replace '_vs20$', '_vs30'
              $base = $base -replace '_vsxx$', '_vs30'
              return "$base.vcs"
          }

          function Get-LegacyOutputNames {
              param([Parameter(Mandatory = $true)][string]$SourceName)

              $base = [IO.Path]::GetFileNameWithoutExtension($SourceName)

              if ($base -match '_ps2x$') {
                  Write-Output "$($base -replace '_ps2x$', '_ps20').vcs"
                  Write-Output "$($base -replace '_ps2x$', '_ps20b').vcs"
                  return
              }

              if ($base -match '_vsxx$') {
                  Write-Output "$($base -replace '_vsxx$', '_vs20').vcs"
                  return
              }

              if ($base -match '_(ps20|ps20b|vs20)$') {
                  Write-Output "$base.vcs"
                  return
              }
          }

          $expected = New-Object System.Collections.Generic.List[string]

          foreach ($source in $shaderSources) {
              $expected.Add((Get-ForcedOutputName $source))

              foreach ($legacy in @(Get-LegacyOutputNames $source)) {
                  $expected.Add($legacy)
              }
          }

          $expected = $expected | Sort-Object -Unique

          $missing = New-Object System.Collections.Generic.List[string]
          $empty = New-Object System.Collections.Generic.List[string]

          foreach ($name in $expected) {
              foreach ($directory in @($sourceOutput, $gameOutput)) {
                  $path = Join-Path $directory $name

                  if (!(Test-Path $path)) {
                      $missing.Add($path)
                      continue
                  }

                  if ((Get-Item $path).Length -le 0) {
                      $empty.Add($path)
                  }
              }
          }

          if ($missing.Count -gt 0) {
              Write-Host "=== Generated shader directories ==="
              foreach ($directory in @(
                  $sourceOutput,
                  $gameOutput,
                  "game\platform\shaders\fxc"
              )) {
                  Write-Host "--- $directory ---"
                  if (Test-Path $directory) {
                      Get-ChildItem $directory -Filter *.vcs -File |
                          Sort-Object Name |
                          Select-Object Name, Length, LastWriteTimeUtc |
                          Format-Table -AutoSize
                  }
                  else {
                      Write-Host "(directory missing)"
                  }
              }

              Write-Host "=== Recovery source mapping ==="
              $recoveryMap = "$env:ARTIFACT_DIR\shader-recovery-map.txt"
              if (Test-Path $recoveryMap) {
                  Get-Content $recoveryMap
              }

              Write-Host "=== Log matches for missing shader basenames ==="
              $missingNames = $missing |
                  ForEach-Object {
                      [IO.Path]::GetFileNameWithoutExtension($_)
                  } |
                  Sort-Object -Unique

              foreach ($logPath in $logPaths) {
                  Write-Host "--- $logPath ---"
                  foreach ($missingName in $missingNames) {
                      Select-String `
                          -Path $logPath `
                          -Pattern ([regex]::Escape($missingName)) `
                          -Context 3, 8 `
                          -ErrorAction SilentlyContinue
                  }
              }

              throw "Missing compiled shader files after isolated recovery:`n$($missing -join "`n")"
          }

          if ($empty.Count -gt 0) {
              throw "Zero-byte compiled shader files:`n$($empty -join "`n")"
          }

          Write-Host "Validated $($expected.Count) required VCS outputs."
          Get-ChildItem $gameOutput -Filter *.vcs |
              Sort-Object Name |
              Select-Object Name, Length, LastWriteTimeUtc |
              Format-Table -AutoSize

      - name: Prepare reusable compiled-shader folder
        if: steps.shader_changes.outputs.compile == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $bundleRoot = Join-Path `
              $env:ARTIFACT_DIR `
              "Compiled-Deferred-Shaders"

          if (Test-Path $bundleRoot) {
              Remove-Item $bundleRoot -Recurse -Force
          }

          $sourceTarget = Join-Path `
              $bundleRoot `
              "src\materialsystem\deferredshaders\shaders\fxc"

          $gameTarget = Join-Path `
              $bundleRoot `
              "game\deferred\shaders\fxc"

          New-Item -ItemType Directory -Force -Path $sourceTarget |
              Out-Null

          New-Item -ItemType Directory -Force -Path $gameTarget |
              Out-Null

          Copy-Item `
              "src\materialsystem\deferredshaders\shaders\fxc\*.vcs" `
              $sourceTarget `
              -Force

          Copy-Item `
              "game\deferred\shaders\fxc\*.vcs" `
              $gameTarget `
              -Force

          $manifest = Get-ChildItem `
              "game\deferred\shaders\fxc" `
              -Filter *.vcs `
              -File |
              Sort-Object Name |
              ForEach-Object {
                  $hash = Get-FileHash $_.FullName -Algorithm SHA256

                  [pscustomobject]@{
                      Name = $_.Name
                      Size = $_.Length
                      SHA256 = $hash.Hash
                  }
              }

          if (@($manifest).Count -eq 0) {
              throw "No compiled VCS files were available for preservation."
          }

          $manifest |
              ConvertTo-Json -Depth 3 |
              Set-Content `
                  (Join-Path $bundleRoot "manifest.json") `
                  -Encoding utf8

          @"
          This folder contains the successfully compiled Deferred VCS files.

          It was uploaded before VPC and C++ compilation started. Therefore,
          these shaders remain downloadable even if a later C++ project fails.

          For the next GitHub Actions run, select:
          Compile Deferred HLSL shaders = false

          The workflow will restore these VCS files from the shader cache and
          will regenerate only the lightweight C++ .inc headers.
          "@ |
              Set-Content `
                  (Join-Path $bundleRoot "README.txt") `
                  -Encoding utf8

          Write-Host "Preserved $(@($manifest).Count) compiled game shaders."
          Get-ChildItem $bundleRoot -Recurse -File |
              Select-Object FullName, Length |
              Format-Table -AutoSize

      - name: Save compiled Deferred VCS cache
        if: steps.shader_changes.outputs.compile == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src/materialsystem/deferredshaders/shaders/fxc
            game/deferred/shaders/fxc
          key: ${{ steps.shader_key.outputs.save_key }}

      - name: Upload compiled shaders before C++ build
        if: steps.shader_changes.outputs.compile == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Compiled-Deferred-Shaders-RH-CACHE-V9-${{ github.run_id }}
          path: artifacts/Compiled-Deferred-Shaders/**
          if-no-files-found: error
          retention-days: 30

      - name: Record preserved shader result
        if: steps.shader_changes.outputs.compile == 'true'
        shell: powershell
        run: |
          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "## Compiled shaders preserved before C++"

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "- Artifact: **Compiled-Deferred-Shaders-RH-CACHE-V9-${{ github.run_id }}**"

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "- A later VPC or C++ failure does not remove this artifact."

          Add-Content `
              $env:GITHUB_STEP_SUMMARY `
              "- Future C++-only run: set **Compile Deferred HLSL shaders = false**."

      - name: Generate Deferred solution with VPC
        shell: cmd
        working-directory: src
        run: |
          @echo off
          setlocal EnableExtensions

          echo === VPC output === > "..\%ARTIFACT_DIR%\vpc.log"

          devtools\bin\vpc.exe ^
            /deferred ^
            +game ^
            /mksln Game_Deferred-2019.sln ^
            /2013 ^
            /define:VS2019 ^
            >> "..\%ARTIFACT_DIR%\vpc.log" 2>&1

          set "VPC_RESULT=%ERRORLEVEL%"

          echo. >> "..\%ARTIFACT_DIR%\vpc.log"
          echo VPC exit code: %VPC_RESULT% >> "..\%ARTIFACT_DIR%\vpc.log"
          type "..\%ARTIFACT_DIR%\vpc.log"

          if not "%VPC_RESULT%"=="0" (
              exit /b %VPC_RESULT%
          )

          for %%F in (
            "Game_Deferred-2019.sln"
            "game\client\client_deferred.vcxproj"
            "game\server\server_deferred.vcxproj"
            "materialsystem\shaderlib\shaderlib.vcxproj"
            "materialsystem\deferredshaders\game_shader_deferred.vcxproj"
          ) do (
            if not exist %%F (
              echo ERROR: Required generated file is missing: %%F
              exit /b 1
            )
          )

      - name: Create native SM2 header source list
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $shaderRoot = "src\materialsystem\deferredshaders"
          $sourceList = Join-Path $shaderRoot "deferred_shaders.txt"
          $legacyList = Join-Path $shaderRoot "deferred_shaders_legacy_ci.txt"

          $legacySources = Get-Content $sourceList |
              ForEach-Object { $_.Trim() } |
              Where-Object {
                  $_ -and
                  !$_.StartsWith("//") -and
                  !$_.StartsWith("#") -and
                  $_ -match '_(ps2x|ps20|ps20b|vs20|vsxx)\.fxc$'
              }

          if (@($legacySources).Count -eq 0) {
              throw "No native SM2 shader sources were found."
          }

          $legacySources |
              Set-Content $legacyList -Encoding ascii

          Write-Host "Native SM2 header sources:"
          $legacySources | ForEach-Object { Write-Host "  $_" }

      - name: Regenerate all Deferred shader C++ headers
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions

          call "%VSDEVCMD%" -no_logo -arch=x86 -host_arch=x64
          if errorlevel 1 (
              echo ERROR: Failed to initialize the Visual Studio developer environment.
              exit /b 1
          )

          where nmake.exe >nul
          if errorlevel 1 (
              echo ERROR: nmake.exe is unavailable.
              exit /b 1
          )

          where perl.exe >nul
          if errorlevel 1 (
              echo ERROR: perl.exe is unavailable.
              exit /b 1
          )

          perl -MString::CRC32 -e "print qq(String::CRC32 OK\n)"
          if errorlevel 1 (
              echo ERROR: String::CRC32 is unavailable.
              exit /b 1
          )

          pushd "%GITHUB_WORKSPACE%\src\materialsystem\deferredshaders"

          set "dynamic_shaders=1"
          set "GAMEDIR=%GITHUB_WORKSPACE%\game\deferred"
          set "SDKBINDIR=..\..\..\game\bin"
          set "SOURCEDIR=..\.."
          set "SM2_BACKUP=%GITHUB_WORKSPACE%\%ARTIFACT_DIR%\sm2-header-backup"

          if exist "%SM2_BACKUP%" rmdir /s /q "%SM2_BACKUP%"
          mkdir "%SM2_BACKUP%"

          attrib -r "fxctmp9\*.inc" /s 2>nul
          attrib -r "fxctmp9_tmp\*.inc" /s 2>nul
          del /f /q "fxctmp9\*.inc" 2>nul
          del /f /q "fxctmp9_tmp\*.inc" 2>nul
          del /f /q "inclist.txt" 2>nul
          del /f /q "makefile.deferred_shaders" 2>nul
          del /f /q "makefile.deferred_shaders.copy" 2>nul
          del /f /q "makefile.deferred_shaders_legacy_ci" 2>nul
          del /f /q "makefile.deferred_shaders_legacy_ci.copy" 2>nul

          rem Pass 1: native shader-model names, including VS20/PS20/PS20b.
          call buildshaders.bat ^
            deferred_shaders_legacy_ci ^
            -game "%GAMEDIR%" ^
            -source "%SOURCEDIR%" ^
            -dx9_30 ^
            > "%GITHUB_WORKSPACE%\%ARTIFACT_DIR%\shader-headers-sm2.log" 2>&1

          for %%F in (
            decalmodulate_vs20.inc
            decalmodulate_ps20.inc
            decalmodulate_ps20b.inc
          ) do (
            if not exist "fxctmp9\%%F" (
              echo ERROR: Native header was not generated: fxctmp9\%%F
              type "%GITHUB_WORKSPACE%\%ARTIFACT_DIR%\shader-headers-sm2.log"
              popd
              exit /b 1
            )

            copy /y "fxctmp9\%%F" "%SM2_BACKUP%\%%F" >nul
            if errorlevel 1 (
              echo ERROR: Failed to preserve %%F
              popd
              exit /b 1
            )
          )

          rem Pass 2: forced SM3 names. The preserved native headers are
          rem restored afterward because the C++ wrapper includes both sets.
          del /f /q "inclist.txt" 2>nul
          del /f /q "makefile.deferred_shaders" 2>nul
          del /f /q "makefile.deferred_shaders.copy" 2>nul

          call buildshaders.bat ^
            deferred_shaders ^
            -game "%GAMEDIR%" ^
            -source "%SOURCEDIR%" ^
            -dx9_30 ^
            -force30 ^
            > "%GITHUB_WORKSPACE%\%ARTIFACT_DIR%\shader-headers-sm3.log" 2>&1

          for %%F in (
            decalmodulate_vs20.inc
            decalmodulate_ps20.inc
            decalmodulate_ps20b.inc
          ) do (
            attrib -r "fxctmp9\%%F" 2>nul
            del /f /q "fxctmp9\%%F" 2>nul

            copy /y "%SM2_BACKUP%\%%F" "fxctmp9\%%F" >nul
            if errorlevel 1 (
              echo ERROR: Failed to restore %%F
              popd
              exit /b 1
            )

            if not exist "fxctmp9\%%F" (
              echo ERROR: Restored header is still missing: fxctmp9\%%F
              popd
              exit /b 1
            )
          )

          popd

          echo === Native SM2 header generation ===
          type "%GITHUB_WORKSPACE%\%ARTIFACT_DIR%\shader-headers-sm2.log"

          echo === Forced SM3 header generation ===
          type "%GITHUB_WORKSPACE%\%ARTIFACT_DIR%\shader-headers-sm3.log"

      - name: Validate shader headers immediately before C++ build
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $root = "src\materialsystem\deferredshaders\fxctmp9"

          $requiredFiles = @(
              "decalmodulate_vs20.inc",
              "decalmodulate_ps20.inc",
              "decalmodulate_ps20b.inc",
              "decalmodulate_vs30.inc",
              "decalmodulate_ps30.inc",
              "lightingpass_global_ps30.inc",
              "radiosity_blend_ps30.inc",
              "radiosity_filter_ps30.inc",
              "radiosity_gen_global_ps30.inc",
              "radiosity_propagate_ps30.inc",
              "radiosity_upsample_ps30.inc",
              "screenspace_combine_ps30.inc",
              "screenspace_shading_ps30.inc",
              "screenspace_vs30.inc",
              "volume_blend_ps30.inc",
              "volume_prepass_ps30.inc",
              "volume_prepass_vs30.inc"
          )

          foreach ($name in $requiredFiles) {
              $path = Join-Path $root $name

              if (!(Test-Path $path)) {
                  throw "Required generated shader header is missing: $path"
              }

              if ((Get-Item $path).Length -le 0) {
                  throw "Generated shader header is empty: $path"
              }
          }

          $blend = Get-Content `
              (Join-Path $root "radiosity_blend_ps30.inc") `
              -Raw

          if ($blend -notmatch '\bSetSECOND_BOUNCE\s*\(') {
              throw "SetSECOND_BOUNCE is missing from radiosity_blend_ps30.inc"
          }

          $global = Get-Content `
              (Join-Path $root "radiosity_gen_global_ps30.inc") `
              -Raw

          if ($global -match 'forgot_to_set_dynamic_CASCADE') {
              throw "Obsolete CASCADE combo remains in radiosity_gen_global_ps30.inc"
          }

          if ($global -notmatch '\bSetSURFACE_MODE\s*\(' -or
              $global -notmatch '\bSetSAMPLE_PHASE\s*\(') {
              throw "Daylight-GI injection permutations are missing from radiosity_gen_global_ps30.inc"
          }

          $filter = Get-Content `
              (Join-Path $root "radiosity_filter_ps30.inc") `
              -Raw

          if ($filter -notmatch '\bSetFILTER_PHASE\s*\(') {
              throw "Daylight-GI filter permutations are missing from radiosity_filter_ps30.inc"
          }

          $propagate = Get-Content `
              (Join-Path $root "radiosity_propagate_ps30.inc") `
              -Raw

          if ($propagate -match 'forgot_to_set_static_BLUR') {
              throw "Obsolete BLUR combo remains in radiosity_propagate_ps30.inc"
          }

          if ($propagate -notmatch '\bSetBOUNCE_MODE\s*\(') {
              throw "Daylight-GI transport permutations are missing from radiosity_propagate_ps30.inc"
          }

          $screenspace = Get-Content `
              (Join-Path $root "screenspace_shading_ps30.inc") `
              -Raw

          if ($screenspace -match 'forgot_to_set_dynamic_RADIOSITY') {
              throw "Obsolete RADIOSITY combo remains in screenspace_shading_ps30.inc"
          }

          $directSunSource = Get-Content `
              "src\materialsystem\deferredshaders\lightingpass_global_ps30.fxc" `
              -Raw

          if ($directSunSource -notmatch 'lightAmount\s*=\s*saturate\(\s*viewFwdDot\s*\)') {
              throw "Global sunlight must retain a linear max(N.L, 0) diffuse ramp"
          }

          if ($directSunSource -match 'lerp\(\s*1\s*,\s*dot\([^\r\n]+\)\s*\*\s*flNormal') {
              throw "Global sunlight reintroduced the obsolete effective N.L-squared normal scaling"
          }

          Write-Host "All required SM2 and SM3 C++ shader headers are present."
          Get-Item ($requiredFiles | ForEach-Object { Join-Path $root $_ }) |
              Select-Object Name, Length, LastWriteTimeUtc |
              Format-Table -AutoSize

      - name: Delete stale C++ outputs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $staleOutputs = @(
              "game\deferred\bin\client.dll",
              "game\deferred\bin\client.pdb",
              "game\deferred\bin\server.dll",
              "game\deferred\bin\server.pdb",
              "game\deferred\bin\game_shader_generic_deferred.dll",
              "game\deferred\bin\game_shader_generic_deferred.pdb"
          )

          foreach ($file in $staleOutputs) {
              Remove-Item $file -Force -ErrorAction SilentlyContinue

              if (Test-Path $file) {
                  throw "Unable to remove stale output: $file"
              }
          }

          $stamp = (Get-Date).ToUniversalTime().ToString("o")
          "CPP_BUILD_START=$stamp" |
              Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Removed all stale client/server/shader DLL outputs."
          Write-Host "C++ build start: $stamp"

      - name: Build generated C++ projects directly
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion

          set "COMMON_ARGS=/m /t:Rebuild /p:Configuration=%BUILD_CONFIGURATION% /p:Platform=Win32 /p:PlatformToolset=v142 /p:WindowsTargetPlatformVersion=10.0.19041.0 /p:PreferredToolArchitecture=x64 /verbosity:minimal"
          set "MASTER_LOG=%ARTIFACT_DIR%\msbuild-console.log"

          echo === Real Enhanced Source C++ build === > "%MASTER_LOG%"
          echo Configuration: %BUILD_CONFIGURATION% >> "%MASTER_LOG%"
          echo Platform: Win32 >> "%MASTER_LOG%"
          echo. >> "%MASTER_LOG%"

          rem The VPC-generated solution has no active Build.0 mappings on this
          rem hosted runner, so MSBuild reports success without building anything.
          rem Build each generated project explicitly in dependency order.

          call :BUILD_PROJECT ^
            "ShaderLib" ^
            "src\materialsystem\shaderlib\shaderlib.vcxproj" ^
            "%ARTIFACT_DIR%\shaderlib-%BUILD_CONFIGURATION%"
          if errorlevel 1 exit /b 1

          call :BUILD_PROJECT ^
            "Shaders (Deferred)" ^
            "src\materialsystem\deferredshaders\game_shader_deferred.vcxproj" ^
            "%ARTIFACT_DIR%\game-shader-%BUILD_CONFIGURATION%"
          if errorlevel 1 exit /b 1

          call :BUILD_PROJECT ^
            "Client (Deferred)" ^
            "src\game\client\client_deferred.vcxproj" ^
            "%ARTIFACT_DIR%\client-%BUILD_CONFIGURATION%"
          if errorlevel 1 exit /b 1

          call :BUILD_PROJECT ^
            "Server (Deferred)" ^
            "src\game\server\server_deferred.vcxproj" ^
            "%ARTIFACT_DIR%\server-%BUILD_CONFIGURATION%"
          if errorlevel 1 exit /b 1

          echo.>> "%MASTER_LOG%"
          echo All four generated projects built successfully.>> "%MASTER_LOG%"
          type "%MASTER_LOG%"
          exit /b 0

          :BUILD_PROJECT
          set "PROJECT_NAME=%~1"
          set "PROJECT_PATH=%~2"
          set "LOG_BASE=%~3"

          echo ==================================================>> "%MASTER_LOG%"
          echo Building !PROJECT_NAME!>> "%MASTER_LOG%"
          echo Project: !PROJECT_PATH!>> "%MASTER_LOG%"
          echo ==================================================>> "%MASTER_LOG%"

          if not exist "!PROJECT_PATH!" (
              echo ERROR: Generated project is missing: !PROJECT_PATH!>> "%MASTER_LOG%"
              type "%MASTER_LOG%"
              exit /b 1
          )

          msbuild.exe "!PROJECT_PATH!" ^
            %COMMON_ARGS% ^
            /bl:"!LOG_BASE!.binlog" ^
            /fl ^
            /flp:"logfile=!LOG_BASE!.log;verbosity=diagnostic" ^
            >> "%MASTER_LOG%" 2>&1

          set "PROJECT_RESULT=!ERRORLEVEL!"

          if not "!PROJECT_RESULT!"=="0" (
              echo ERROR: !PROJECT_NAME! failed with exit code !PROJECT_RESULT!.>> "%MASTER_LOG%"
              type "%MASTER_LOG%"
              exit /b !PROJECT_RESULT!
          )

          echo SUCCESS: !PROJECT_NAME!>> "%MASTER_LOG%"
          echo.>> "%MASTER_LOG%"
          exit /b 0

      - name: Verify newly compiled DLLs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $buildStart = [DateTime]::Parse(
              $env:CPP_BUILD_START,
              [Globalization.CultureInfo]::InvariantCulture,
              [Globalization.DateTimeStyles]::RoundtripKind
          ).ToUniversalTime()

          $required = @(
              "game\deferred\bin\client.dll",
              "game\deferred\bin\server.dll",
              "game\deferred\bin\game_shader_generic_deferred.dll"
          )

          $results = foreach ($file in $required) {
              if (!(Test-Path $file)) {
                  throw "The project build did not create: $file"
              }

              $item = Get-Item $file

              if ($item.Length -le 0) {
                  throw "The compiled output is empty: $file"
              }

              if ($item.LastWriteTimeUtc -lt $buildStart.AddMinutes(-1)) {
                  throw "The output is stale rather than newly compiled: $file"
              }

              $hash = Get-FileHash $file -Algorithm SHA256

              [pscustomobject]@{
                  File = $file
                  Size = $item.Length
                  ModifiedUtc = $item.LastWriteTimeUtc
                  SHA256 = $hash.Hash
              }
          }

          $results | Format-Table -AutoSize

          $results |
              ConvertTo-Json -Depth 3 |
              Set-Content `
                  "$env:ARTIFACT_DIR\compiled-dll-manifest.json" `
                  -Encoding utf8

      - name: Create ready-to-copy game patch
        if: success()
        shell: powershell
        env:
          COMPILE_SHADERS: ${{ steps.shader_changes.outputs.compile }}
        run: |
          $ErrorActionPreference = "Stop"

          $packageRoot = Join-Path `
              $env:ARTIFACT_DIR `
              "Enhanced-Source-$env:BUILD_CONFIGURATION-Game-Patch"

          $binTarget = Join-Path $packageRoot "bin"
          $shaderTarget = Join-Path $packageRoot "shaders"

          New-Item -ItemType Directory -Force -Path $binTarget | Out-Null
          New-Item -ItemType Directory -Force -Path $shaderTarget | Out-Null

          $requiredDlls = @(
              "game\deferred\bin\client.dll",
              "game\deferred\bin\server.dll",
              "game\deferred\bin\game_shader_generic_deferred.dll"
          )

          $missingDlls = $requiredDlls |
              Where-Object { !(Test-Path $_) }

          if ($missingDlls) {
              throw "Missing compiled DLLs: $($missingDlls -join ', ')"
          }

          Get-ChildItem "game\deferred\bin" -File |
              Where-Object { $_.Extension -in ".dll", ".pdb", ".map" } |
              Copy-Item -Destination $binTarget -Force

          if (!(Test-Path "game\deferred\shaders\fxc")) {
              throw "The compiled or cached game shader folder is missing."
          }

          Copy-Item `
              "game\deferred\shaders\*" `
              $shaderTarget `
              -Recurse `
              -Force

          if ($env:COMPILE_SHADERS -eq "true") {
              "Deferred shaders were rebuilt in this workflow run." |
                  Set-Content `
                      (Join-Path $packageRoot "SHADERS_REBUILT.txt") `
                      -Encoding utf8
          }
          else {
              @"
          Deferred shaders were restored from the matching GitHub Actions cache.

          The cache identity is based only on shader sources, compiler scripts,
          and shader compiler binaries. C++-only changes do not invalidate it.
          "@ |
                  Set-Content `
                      (Join-Path $packageRoot "SHADERS_RESTORED_FROM_CACHE.txt") `
                      -Encoding utf8
          }

          Write-Host "Ready-to-copy package:"
          Get-ChildItem $packageRoot -Recurse -File |
              Select-Object FullName, Length |
              Format-Table -AutoSize

      - name: Upload game patch
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Enhanced-Source-${{ env.BUILD_CONFIGURATION }}-${{ steps.shader_changes.outputs.artifact_mode }}
          path: artifacts/Enhanced-Source-${{ env.BUILD_CONFIGURATION }}-Game-Patch/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Enhanced-Source-${{ env.BUILD_CONFIGURATION }}-Build-Logs
          path: |
            artifacts/**
            src/Game_Deferred-2019.sln
            src/game/client/client_deferred.vcxproj
            src/game/server/server_deferred.vcxproj
            src/materialsystem/shaderlib/shaderlib.vcxproj
            src/materialsystem/deferredshaders/game_shader_deferred.vcxproj
            src/materialsystem/deferredshaders/fxctmp9/*.inc
            src/materialsystem/deferredshaders/fxctmp9_tmp/*.inc
          if-no-files-found: warn
          retention-days: 30
