name: Build Enhanced Source

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release
  push:
    branches:
      - master
      - main
    paths:
      - "src/**"
      - ".github/workflows/build-enhanced-source.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.configuration || 'Debug' }} Win32
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      BUILD_CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
      ARTIFACT_DIR: artifacts

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Prepare artifact directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:ARTIFACT_DIR | Out-Null

      - name: Verify MSVC v142
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vsPath = & $vswhere `
              -latest `
              -products * `
              -requires Microsoft.VisualStudio.Component.VC.v142.x86.x64 `
              -property installationPath

          if (!$vsPath) {
              $vsPath = & $vswhere `
                  -latest `
                  -products * `
                  -requires Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64 `
                  -property installationPath
          }

          if (!$vsPath) {
              throw "MSVC v142 x86/x64 was not found on the runner."
          }

          Write-Host "Visual Studio: $vsPath"
          Write-Host "MSBuild:"
          Get-Command msbuild.exe | Format-List Source

          Write-Host "Installed MSVC versions:"
          Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory |
              Select-Object -ExpandProperty Name

      - name: Add legacy VPC registry compatibility
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions

          set "CPP_GUID={8BC9CEB8-8B4A-11D0-8D11-00A0C91BC942}"

          rem Old Source SDK 2013 VPC searches the 32-bit Visual Studio
          rem registry view for the Visual C++ project type.
          reg add "HKLM\SOFTWARE\Microsoft\VisualStudio\10.0\VC\Projects\%CPP_GUID%" ^
            /v DefaultProjectExtension ^
            /t REG_SZ ^
            /d vcproj ^
            /f ^
            /reg:32

          if errorlevel 1 exit /b 1

          rem Also expose a VS2013-compatible entry. This is harmless and
          rem matches the /2013 project-generation mode.
          reg add "HKLM\SOFTWARE\Microsoft\VisualStudio\12.0\VC\Projects\%CPP_GUID%" ^
            /v DefaultProjectExtension ^
            /t REG_SZ ^
            /d vcxproj ^
            /f ^
            /reg:32

          if errorlevel 1 exit /b 1

          echo === VS 10 compatibility key ===
          reg query "HKLM\SOFTWARE\Microsoft\VisualStudio\10.0\VC\Projects\%CPP_GUID%" /reg:32

          echo === VS 12 compatibility key ===
          reg query "HKLM\SOFTWARE\Microsoft\VisualStudio\12.0\VC\Projects\%CPP_GUID%" /reg:32

      - name: Generate Deferred solution with VPC
        shell: cmd
        working-directory: src
        run: |
          @echo off
          setlocal EnableExtensions

          echo === VPC output === > "..\%ARTIFACT_DIR%\vpc.log"

          devtools\bin\vpc.exe ^
            /deferred ^
            +game ^
            /mksln Game_Deferred-2019.sln ^
            /2013 ^
            /define:VS2019 ^
            >> "..\%ARTIFACT_DIR%\vpc.log" 2>&1

          set "VPC_RESULT=%ERRORLEVEL%"

          echo. >> "..\%ARTIFACT_DIR%\vpc.log"
          echo VPC exit code: %VPC_RESULT% >> "..\%ARTIFACT_DIR%\vpc.log"
          type "..\%ARTIFACT_DIR%\vpc.log"

          if not "%VPC_RESULT%"=="0" (
              echo ERROR: VPC returned exit code %VPC_RESULT%.
              exit /b %VPC_RESULT%
          )

          if not exist "Game_Deferred-2019.sln" (
              echo ERROR: Game_Deferred-2019.sln was not generated.
              exit /b 1
          )

          if not exist "client_deferred.vcxproj" (
              echo ERROR: client_deferred.vcxproj was not generated.
              exit /b 1
          )

          if not exist "server_deferred.vcxproj" (
              echo ERROR: server_deferred.vcxproj was not generated.
              exit /b 1
          )

          if not exist "shaderlib.vcxproj" (
              echo ERROR: shaderlib.vcxproj was not generated.
              exit /b 1
          )

          if not exist "game_shader_deferred.vcxproj" (
              echo ERROR: game_shader_deferred.vcxproj was not generated.
              exit /b 1
          )

          echo === Generated project files ===
          dir /b Game_Deferred-2019.sln *.vcxproj

          copy /y "Game_Deferred-2019.sln" "..\%ARTIFACT_DIR%\Game_Deferred-2019.sln" >nul

      - name: Build Deferred solution
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions

          msbuild.exe "src\Game_Deferred-2019.sln" ^
            /m ^
            /t:Build ^
            /p:Configuration=%BUILD_CONFIGURATION% ^
            /p:Platform=Win32 ^
            /p:PlatformToolset=v142 ^
            /p:PreferredToolArchitecture=x64 ^
            /verbosity:minimal ^
            /bl:"%ARTIFACT_DIR%\EnhancedSource-%BUILD_CONFIGURATION%.binlog" ^
            /fl ^
            /flp:"logfile=%ARTIFACT_DIR%\EnhancedSource-%BUILD_CONFIGURATION%.log;verbosity=diagnostic" ^
            > "%ARTIFACT_DIR%\msbuild-console.log" 2>&1

          set "BUILD_RESULT=%ERRORLEVEL%"
          type "%ARTIFACT_DIR%\msbuild-console.log"
          exit /b %BUILD_RESULT%

      - name: Collect compiled binaries
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $source = "game\deferred\bin"
          $destination = "$env:ARTIFACT_DIR\Enhanced-Source-$env:BUILD_CONFIGURATION-Win32"

          $required = @(
              "$source\client.dll",
              "$source\server.dll",
              "$source\game_shader_generic_deferred.dll"
          )

          $missing = $required | Where-Object { !(Test-Path $_) }

          if ($missing) {
              throw "Missing expected outputs: $($missing -join ', ')"
          }

          New-Item -ItemType Directory -Force -Path $destination | Out-Null

          Get-ChildItem $source -File |
              Where-Object { $_.Extension -in ".dll", ".pdb", ".map" } |
              Copy-Item -Destination $destination -Force

          Get-ChildItem $destination |
              Select-Object Name, Length, LastWriteTime |
              Format-Table -AutoSize

      - name: Upload compiled binaries
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Enhanced-Source-${{ env.BUILD_CONFIGURATION }}-Win32
          path: artifacts/Enhanced-Source-${{ env.BUILD_CONFIGURATION }}-Win32/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Enhanced-Source-${{ env.BUILD_CONFIGURATION }}-Diagnostic-Logs
          path: |
            artifacts/**
            src/Game_Deferred-2019.sln
            src/*.vcxproj
            src/*.vcxproj.filters
          if-no-files-found: warn
          retention-days: 30
